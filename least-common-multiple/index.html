<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محقق المضاعفات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the same squared maths notebook as the prime-factorization game (red margin rule, navy band), so both games read as one series. Primes are fruit colours, common factors get the yellow highlighter. */
:root{
  --paper:#f5f8fd; --grid:#dde5f4; --ink:#1b2a57; --soft:#56628c; --rule:#dc5048;
  --mark:#ffe14a; --tile:#ffffff; --edge:#b7c3e2; --line:#c5cfe9;
  --ok:#14774f; --ok-bg:#dff3e8; --bad:#ae2f28; --bad-bg:#fbe4e1; --tip-bg:#fff6cc; --tip:#6b5200;
  --band:#22307c; --sun:#ffd84a; --ant:#8a3d1c; --wood:#8a5a2b; --leaf:#3f9b4a;
  --c1:#e2553a; --c2:#2867d6; --c3:#169a68; --c4:#7d4ad6; --c5:#d98d0b; --c6:#d03a72;
  --f-display:"Lalezar","Readex Pro",Tahoma,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--rule);outline-offset:3px}
.app{position:relative;max-width:980px;margin:0 auto;padding:0 16px 120px}
.app::before{content:"";position:absolute;top:0;bottom:0;right:6px;width:2px;background:var(--rule);opacity:.5;pointer-events:none}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---------- band with maths symbols ---------- */
.hero{position:relative;overflow:hidden;background:var(--band);color:#fff;border-radius:0 0 22px 22px;padding:18px 20px 16px;margin:0 -16px 18px}
.fsym{position:absolute;font-family:var(--f-display);color:#fff;opacity:.12;pointer-events:none;line-height:1;user-select:none}
.hero-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.kicker{margin:0;font-size:13px;opacity:.8}
.hero h1{font-size:clamp(28px,6vw,40px)}
.hero h1 span{color:var(--sun)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--f-body);color:#fff;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px 6px 6px;min-height:40px}
.pill.btnlike{cursor:pointer}
.pill .av{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.pill .av{color:var(--band);font-family:var(--f-display);font-size:18px}
.pill b{font-family:var(--f-display);font-weight:400;font-size:20px}
.ibtn{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;display:grid;place-items:center}
.ibtn svg{width:20px;height:20px}
.ibtn[aria-pressed="false"]{opacity:.55}

/* ---------- round head ---------- */
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.rhead h2{font-size:clamp(24px,5vw,32px)}
.rhead .eyebrow{display:block;font-size:14px;color:var(--soft)}
.pair-n{display:inline-block;background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 4px}
.rbar{display:flex;gap:5px;width:150px}
.rbar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rbar i.done{background:var(--c3)}.rbar i.now{background:var(--ink)}
.stepper{display:flex;gap:6px;list-style:none;margin:0 0 14px;padding:0;counter-reset:s;overflow-x:auto}
.stepper li{counter-increment:s;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);padding:6px 10px 6px 12px;border-radius:999px;background:var(--tile);border:1.5px solid var(--line);white-space:nowrap}
.stepper li::before{content:counter(s,arabic-indic);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-weight:600}
.stepper li.now{border-color:var(--ink);color:var(--ink);font-weight:600}
.stepper li.now::before{background:var(--ink);color:#fff}
.stepper li.done::before{content:"✓";background:var(--c3);color:#fff}

/* ---------- stage ---------- */
.card{background:var(--tile);border:1.5px solid var(--line);border-radius:18px;padding:20px}
.ptitle{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sym{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--f-display);font-size:30px;line-height:1;flex:none}
.ptitle h3{font-size:24px}
.ptitle p{margin:0;font-size:14px;color:var(--soft)}
.stage{display:grid;gap:20px}
@media (min-width:780px){.stage.two{grid-template-columns:1.15fr 1fr;align-items:start}}
.side{display:grid;gap:14px;align-content:start;min-width:0}
.ask{margin:0;font-size:19px;font-weight:600}
.ask b{font-family:var(--f-display);font-weight:400;font-size:1.3em}
.ask small{display:block;font-size:14px;color:var(--soft);font-weight:400}
.btn{font:600 16px/1 var(--f-body);padding:13px 20px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0d1638}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #0d1638}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* method choice */
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.seg button+button{border-inline-start:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg svg{width:18px;height:18px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcard{display:grid;gap:8px;justify-items:center;text-align:center;padding:18px 12px;border-radius:16px;border:2px solid var(--line);background:var(--tile);box-shadow:0 4px 0 var(--line);transition:transform .15s,border-color .15s}
.mcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.mcard svg{width:86px;height:86px}
.mcard strong{font-family:var(--f-display);font-weight:400;font-size:22px}
.mcard small{color:var(--soft);font-size:13px}
@media (max-width:420px){.methods{grid-template-columns:1fr}.mcard{grid-template-columns:auto 1fr;justify-items:start;text-align:start;column-gap:12px}.mcard svg{grid-row:1/3;width:64px;height:64px}}

/* tiles + keypad */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.tile{min-width:58px;height:58px;padding:0 14px;border-radius:12px;background:var(--tile);border:1.5px solid var(--edge);box-shadow:0 3px 0 var(--edge);font:600 24px/1 var(--f-body);color:var(--ink)}
.tile.w{font-size:20px}
.tile.yn{font-size:17px;padding:0 18px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.tile.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tile.no,.tile:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.tile.no{text-decoration:line-through}
.pairin{display:flex;align-items:center;gap:10px;font:600 26px/1 var(--f-body);flex-wrap:wrap}
.pairin b{font-family:var(--f-display);font-weight:400;font-size:34px}
.pbox{min-width:76px;height:60px;border-radius:12px;border:2.5px dashed var(--soft);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--soft);cursor:pointer;background:var(--tile)}
.pbox.act{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--tip-bg)}
.pbox.filled{color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:8px}
.key{height:52px;border-radius:12px;background:var(--tile);border:1.5px solid var(--edge);box-shadow:0 3px 0 var(--edge);font:600 24px/1 var(--f-body);color:var(--ink)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.key.fn{font-size:15px}
.key.go{background:var(--ink);color:#fff;border-color:var(--ink);font-size:16px;box-shadow:0 3px 0 #0d1638}
.flash{background:var(--bad-bg)!important;border-color:var(--bad)!important}

/* factor tree */
.treebox{display:flex;justify-content:center;min-width:0}
.treebox svg{width:100%;max-width:520px;height:auto;max-height:58vh;overflow:visible}
.branch{fill:none;stroke:var(--wood);stroke-linecap:round}
.tleaf{fill:var(--leaf)}
.knot{fill:var(--tile);stroke:var(--wood);stroke-width:3}
.ring{fill:none;stroke:transparent;stroke-width:2.5;stroke-dasharray:6 6}
.tnode.cur .ring{stroke:var(--ink);animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.tnum{font:600 21px/1 var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.fruitnum{fill:#fff;font-size:22px}
.stem{fill:none;stroke:var(--wood);stroke-width:3;stroke-linecap:round}
.fleaf{fill:var(--leaf)}
.crown ellipse{fill:var(--leaf)}

/* ladder */
.ladder{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.lrow,.lhead{display:grid;grid-template-columns:110px 84px}
.lhead span{font-size:12px;color:var(--soft);text-align:center;padding-bottom:4px}
.lrow>span{display:flex;align-items:center;justify-content:center;min-height:60px;font:600 30px/1 var(--f-body)}
.lrow .pr{border-inline-start:3px solid var(--ink)}
.lrow .numc{gap:2px;direction:ltr}
.dg{min-width:26px;text-align:center;border-radius:6px;padding:2px 3px;position:relative;transition:background-color .25s}
.dg.lit{background:var(--mark)}
.dg .cb{position:absolute;top:-6px;inset-inline-end:-10px;font-size:14px;color:var(--c1)}
.dg.box{border:2px dashed var(--ink);min-width:32px;color:var(--soft);font-size:24px;background:var(--tip-bg)}
.lrow.end .numc{color:var(--ok)}
.pv{padding:2px 8px;border-radius:6px}
.pv.lit{background:var(--mark)}
.slot{display:inline-grid;place-items:center;width:56px;height:46px;border:2px dashed var(--ink);border-radius:10px;font-size:22px;color:var(--soft);background:var(--tip-bg)}

/* result + chips */
.result{display:grid;gap:12px;padding-top:12px;border-top:2px solid var(--line)}
.eq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 22px/1.4 var(--f-body)}
.eq b{font-family:var(--f-display);font-weight:400;font-size:30px}
.times{color:var(--soft);font-weight:700}
.chip{min-width:42px;height:42px;padding:0 10px;border-radius:999px;border:0;background:var(--c,var(--c2));color:#fff;font:600 21px/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.chip.sm{min-width:32px;height:32px;font-size:16px}
.chip.hl{background:var(--mark);color:var(--ink);outline:3px solid #e8bf13;outline-offset:-3px;box-shadow:none}
.chip .badge{position:absolute;top:-8px;inset-inline-start:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.note{margin:0;font-size:14px;color:var(--soft)}

/* matching */
.mrows{display:grid;gap:12px}
.mrow{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--paper);border:1.5px solid var(--line)}
.mrow .lbl{font-family:var(--f-display);font-size:32px;text-align:center}
.mchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mchips .chip{min-width:50px;height:50px;font-size:23px;cursor:pointer;transition:transform .12s}
.chip.sel{outline:4px solid var(--ink);outline-offset:2px;transform:translateY(-4px)}
.chip.hl{cursor:default}

/* drag + common box */
.mchips .chip{touch-action:none;user-select:none;-webkit-user-select:none}
.mrows{position:relative}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.ink line{stroke:var(--mark);stroke-width:30;stroke-linecap:round;opacity:.6;mix-blend-mode:multiply}
.ink line.live{opacity:.5}
.ink line.bad{stroke:var(--bad);opacity:.3}
.chip.over{outline:4px dashed var(--ink);outline-offset:3px}
.cbox{border:2.5px dashed #e8bf13;background:var(--tip-bg);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.cbox-lbl{font-size:13px;font-weight:600;color:var(--tip)}
.cbox-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px}
.cbox-in .ph{font-size:14px;color:var(--tip);opacity:.8}

/* story */
.story{display:grid;gap:14px}
.story-text{margin:0;font-size:18px;line-height:1.9}
.story-text b{font-family:var(--f-display);font-weight:400;font-size:1.3em;background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 3px}
.piles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pile{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;align-content:start}
.pile h4{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.pile h4 .num{font-size:22px}
.icons{display:flex;flex-wrap:wrap;gap:2px}
.icons svg{width:22px;height:22px}
.icons.dense svg{width:15px;height:15px}
.seek{border:2px solid var(--ink);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--tile)}
.seek h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.seek ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.seek li{display:flex;gap:8px;align-items:flex-start}
.seek li i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;background:var(--c3)}
.seek li i.x{background:var(--bad)}
.seek li i.q{background:var(--c5)}
.seek .key-idea{background:var(--mark);border-radius:10px;padding:8px 12px;font-weight:600}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grp{border:2px solid var(--edge);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:1px;max-width:96px;justify-content:center;background:var(--tile)}
.grp svg{width:16px;height:16px}
.per{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:600}
.per span{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:999px;padding:4px 12px}
.per svg{width:22px;height:22px}
@media (max-width:420px){.piles{grid-template-columns:1fr}}

/* menu */
.menu{display:grid;gap:16px}
.menu h2{font-size:clamp(26px,5vw,34px)}
.menu-sub{margin:0;color:var(--soft)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode{display:grid;gap:8px;align-content:start;justify-items:center;text-align:center;padding:18px 14px;border-radius:18px;border:2px solid var(--line);background:var(--tile);box-shadow:0 5px 0 var(--line);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--ink)}
.mode .art{width:110px;height:96px;display:grid;place-items:center}
.mode .art svg{width:100%;height:100%}
.mode strong{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.3}
.mode small{color:var(--soft);font-size:14px}
.mode .tag{font-size:12px;font-weight:600;color:#fff;background:var(--c);border-radius:999px;padding:2px 10px}
@media (max-width:640px){.modes{grid-template-columns:1fr}.mode{grid-template-columns:auto 1fr;justify-items:start;text-align:start;column-gap:14px}.mode .art{grid-row:1/4;width:84px;height:76px}}

/* fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--f-display);line-height:1.15;vertical-align:middle}
.frac>span{padding:0 6px}
.frac>span:first-child{border-bottom:3px solid currentColor}
.frac.big{font-size:44px}
.frac.mid{font-size:30px}
.fbar{display:flex;height:46px;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;width:100%;background:var(--tile)}
.fbar i{flex:1;border-inline-start:2px solid var(--ink);transition:border-color .5s,background-color .4s}
.fbar i:first-child{border-inline-start:0}
.fbar i.on{background:var(--c2)}
.fbar.merge i.in{border-inline-start-color:transparent}
.fbar.b i.on{background:var(--c3)}
.food{display:grid;justify-items:center;gap:4px}
.food svg{width:150px;height:150px}
.food .cap{font-size:13px;color:var(--soft);text-align:center}
.slice-line{stroke:#7a4b22;stroke-width:2;transition:opacity .6s}
.merge .slice-line.in{opacity:.55;stroke-width:1.4}
.merge .slice-line.edge{stroke:#1b2a57;stroke-width:4.5}
.choc{display:flex;width:100%;max-width:330px;height:54px;border-radius:8px;overflow:hidden;border:3px solid #4a2a14;background:#4a2a14}
.choc i{flex:1;background:#efe3d6;border-radius:2px;margin-inline-start:3px;transition:margin .6s}
.choc i:first-child{margin-inline-start:0}
.choc i.on{background:linear-gradient(160deg,#9a5c33,#6b3b1d);box-shadow:inset 0 3px 0 rgba(255,255,255,.18)}
.choc.merge i.cut{margin-inline-start:9px}
.choc.merge{background:#f5f8fd;border-color:transparent}
.choc.merge i{outline:2px solid #4a2a14}
.fview{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.fbox{display:grid;gap:6px;justify-items:center}
.fbox .pbox{min-width:84px;height:54px}
.fline{width:100px;height:3px;background:var(--ink);border-radius:2px}
.fop{display:grid;grid-template-columns:auto auto auto auto;gap:6px 10px;align-items:center;font:600 24px/1 var(--f-body)}
.eqv{font-weight:600;text-align:center;margin:0}

.credit{text-align:center;color:var(--soft);font-size:14px;font-weight:600;margin-top:28px}

.ulbl{font-weight:600;font-size:14px;color:var(--soft);min-width:120px}
.merge.split .slice-line.in{opacity:0}
.choc.joined i.in{margin-inline-start:0}
.nl text{font:600 12px var(--f-body);fill:var(--soft);text-anchor:middle}
.nl .meet{font:400 18px var(--f-display);fill:var(--ink)}
.jumps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jump{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px}
.jump svg{width:40px;height:40px;flex:none}
.jump b{font-family:var(--f-display);font-weight:400;font-size:24px}
@media (max-width:420px){.jumps{grid-template-columns:1fr}}
.conv{display:grid;gap:14px;justify-items:center}
.conv-row{display:flex;align-items:center;gap:10px;font:600 22px/1 var(--f-body)}
.mult{font-size:15px;color:var(--c4);font-weight:700;display:grid;gap:30px;text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cmp>div{display:grid;justify-items:center;gap:6px}
@media (max-width:420px){.cmp .food svg{width:130px;height:130px}}

/* answer */
.answer{display:grid;gap:16px;justify-items:center}
.ans-eq{display:flex;align-items:center;gap:10px;font:600 22px/1.4 var(--f-body);flex-wrap:wrap;justify-content:center}
.ans-box{min-width:96px;height:64px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:36px;background:var(--tip-bg)}
.ans-box.empty{color:var(--edge)}

/* summary */
.stars{display:flex;gap:6px;justify-content:center;font-size:46px;line-height:1;color:var(--sun);text-shadow:0 2px 0 #d9a90c}
.stars .off{color:var(--line);text-shadow:none}
.recap{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--paper)}
.recap-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.recap-row .lbl{font-family:var(--f-display);font-size:22px;min-width:76px}
.center{text-align:center}

/* ---------- Namnam helper bar ---------- */
.helper{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px 12px;pointer-events:none}
.helper-in{pointer-events:auto;max-width:948px;margin:0 auto;display:flex;align-items:flex-end;gap:10px}
.helper .antw{width:72px;flex:none}
.bubble{flex:1;position:relative;background:var(--tile);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;min-height:52px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(27,42,87,.16);font-size:15px;line-height:1.6}
.bubble::after{content:"";position:absolute;bottom:14px;right:-10px;width:16px;height:16px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg)}
.bubble.ok{background:var(--ok-bg);color:#0d5236}
.bubble.bad{background:var(--bad-bg);color:#7e1f1a}
.bubble.tip{background:var(--tip-bg);color:var(--tip)}
.bubble .txt{flex:1}
.hint-btn{flex:none;border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:inherit}
.ant .b{fill:var(--ant)}
.ant .ln{stroke:var(--ant);stroke-width:3;fill:none;stroke-linecap:round}
.ant .lens{fill:rgba(255,255,255,.55);stroke:var(--ink);stroke-width:2.6}
.ant .hdl{stroke:var(--ink);stroke-width:4;stroke-linecap:round}

/* ---------- welcome modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(17,26,60,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.modal{width:100%;max-width:440px;background:var(--tile);border-radius:24px;padding:24px 22px 22px;display:grid;gap:16px;position:relative;box-shadow:0 24px 60px rgba(10,16,40,.35)}
.modal .antbig{width:110px;margin:-74px auto 0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
.modal h2{font-size:28px;text-align:center}
.modal p{margin:0;text-align:center;color:var(--soft)}
.field label.lbl{display:block;font-weight:600;margin-bottom:6px}
.text-in{width:100%;padding:13px 16px;border:2px solid var(--edge);border-radius:12px;background:#fff;font-size:20px}
.text-in:focus{border-color:var(--ink);outline:none}
.text-in[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin:6px 0 0;min-height:1.3em}

/* certificate */
.cert{background:var(--tile);border:2px solid var(--ink);border-radius:20px;padding:30px 22px;display:grid;gap:14px;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--edge);border-radius:14px;pointer-events:none}
.cert .student{font-family:var(--f-display);font-size:clamp(36px,9vw,54px);background:linear-gradient(transparent 60%,var(--mark) 60%);justify-self:center;padding:8px 10px 0;line-height:1.4}
.cert table{width:100%;border-collapse:collapse}
.cert th,.cert td{padding:8px;border-bottom:1px solid var(--line)}
.cert th{color:var(--soft);font-weight:500;font-size:13px}
.cert td{font-weight:600;font-size:18px}

.spark{position:fixed;z-index:60;font-family:var(--f-display);font-size:26px;pointer-events:none}
@media (max-width:520px){
  .card{padding:16px}
  .rbar{width:100%}
  .helper .antw{width:56px}
  .bubble{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const AR="٠١٢٣٤٥٦٧٨٩";
const ar=n=>String(n).replace(/\d/g,d=>AR[+d]);
const $=s=>document.querySelector(s);
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const spf=n=>{for(let i=2;i<=n;i++)if(n%i===0)return i;return n};
const factors=n=>{const f=[];let m=n;while(m>1){const p=spf(m);f.push(p);m/=p}return f};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const times=f=>f.map(ar).join(" × ");
const esc=t=>t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const FRUIT={2:"var(--c1)",3:"var(--c5)",5:"var(--c4)",7:"var(--c3)"};
const chip=(p,cls="")=>`<span class="chip ${cls}" style="--c:${FRUIT[p]||"var(--c2)"}">${ar(p)}</span>`;
const chipsJoin=(f,cls="")=>f.map(p=>chip(p,cls)).join('<span class="times">×</span>');
const tpl=id=>document.getElementById(id).innerHTML;

/* ---------- motion ---------- */
const G=window.gsap||null;let RM=!G;
if(G){G.defaults({ease:"power3.out",duration:.45});G.matchMedia().add("(prefers-reduced-motion: reduce)",()=>{RM=true;return()=>{RM=false}})}
const live=()=>G&&!RM;
const T={
  from(t,v){if(live())return G.from(t,v);v.onComplete&&v.onComplete()},
  fromTo(t,a,b){if(live())return G.fromTo(t,a,b);b.onComplete&&b.onComplete()},
  later(s,fn){live()?G.delayedCall(s,fn):setTimeout(fn,0)}
};
function shake(el){if(!el)return;const els=el.length!==undefined?[...el]:[el];els.forEach(e=>{e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),600)});if(live())G.fromTo(els,{x:-9},{x:0,duration:.6,ease:"elastic.out(1,.3)"})}
function pop(el){T.fromTo(el,{scale:1.3},{scale:1,duration:.45,ease:"back.out(2.2)"})}
function burst(el){
  if(!live()||!el)return;
  const r=el.getBoundingClientRect(),syms=["÷","×","=","٢","٣","٥","٧","+"];
  for(let j=0;j<14;j++){
    const s=document.createElement("span");s.className="spark";s.textContent=syms[j%syms.length];
    s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+40)+"px";s.style.color="var(--c"+(1+j%6)+")";document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=70+Math.random()*80;
    G.fromTo(s,{x:0,y:0,scale:.4,autoAlpha:1},{x:Math.cos(a)*d,y:Math.sin(a)*d-30,scale:1.2,rotation:(Math.random()-.5)*120,autoAlpha:0,duration:1,ease:"power2.out",onComplete:()=>s.remove()});
  }
}

/* ---------- auto-scroll: keep the active question in view ---------- */
let viewT=null;
function view(el,where){
  if(!el)return;clearTimeout(viewT);
  viewT=setTimeout(()=>{
    const r=el.getBoundingClientRect(),bar=($("#helper").offsetHeight||90)+12,top=12,vh=window.innerHeight;
    if(where==="top"){window.scrollBy({top:r.top-top,behavior:live()?"smooth":"auto"});return}
    if(r.top>=top&&r.bottom<=vh-bar)return; /* already fully visible */
    const dy=r.height>vh-bar-top?r.top-top:r.bottom-(vh-bar);
    window.scrollBy({top:dy,behavior:live()?"smooth":"auto"});
  },120);
}
/* ---------- sound ---------- */
let AC=null,soundOn=true;
function tone(fs,dur,type,vol){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;const st=t0+i*dur;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol||.15,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+dur*1.8);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+dur*2)})}catch(e){}}
const sfx={ok:()=>tone([660,990],.08),bad:()=>tone([240,190],.11,"triangle",.12),win:()=>tone([523,659,784,1047],.1)};
$("#soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("#soundBtn").setAttribute("aria-pressed",soundOn);$("#soundBtn").setAttribute("aria-label",soundOn?"الصوت مفعّل":"الصوت متوقف");$("#waves").style.display=soundOn?"":"none";if(soundOn)sfx.ok()});

/* ---------- state ---------- */
const POOL={
  easy:[[4,6],[6,8],[4,10],[6,9],[8,12],[10,15],[6,10],[9,12]],
  medium:[[12,18],[8,10],[12,16],[14,21],[15,20],[12,20],[10,25],[16,20]],
  coprime:[[4,9],[5,6],[3,8],[4,7],[5,8]],
  hard:[[18,24],[20,30],[16,24],[12,30],[18,27],[20,25],[24,30],[21,28]]
};
const lcm=(a,b)=>a/gcd(a,b)*b;
const S={name:"",round:0,plan:[],stars:0,results:[],step:0,slips:0,pair:null,method:null,hintFn:null,ans:"",ansTries:0};
const PRAISE=()=>pick(["عمل رائع!","إجابة ممتازة!","برافو!","تفكير ذكي!","رائع!"]);

/* ---------- Namnam ---------- */
$("#helperAnt").innerHTML=tpl("antTpl");$("#modalAnt").innerHTML=tpl("antTpl");
function nam(html,type){
  const b=$("#bubble");b.className="bubble"+(type?" "+type:"");
  if(type==="ok"){sfx.ok();html='<b>'+PRAISE().replace("!",Math.random()<.45&&S.name?" يا "+esc(S.name)+"!":"!")+"</b> "+html}
  else if(type==="bad"){sfx.bad();S.slips++}
  $("#bubbleTxt").innerHTML=html;
  T.fromTo(b,{y:8,autoAlpha:.4},{y:0,autoAlpha:1,duration:.3});
  const ant=$("#helperAnt .ant");
  if(live()){
    if(type==="ok")G.fromTo(ant,{y:0},{y:-14,yoyo:true,repeat:1,duration:.18,ease:"power1.out"});
    else if(type==="bad")G.fromTo(ant,{rotation:0},{keyframes:{rotation:[-8,8,-5,0]},duration:.4,transformOrigin:"50% 90%"});
  }
}
$("#hintBtn").addEventListener("click",()=>{
  const h=S.hintFn&&S.hintFn();
  if(!h){nam("أنا معك! تابع الخطوة الحالية.","");return}
  S.hints=(S.hints||0)+1;
  if(S.hints>1)S.slips++;
  nam("تلميح: "+h+(S.hints===1?'<br><small>التلميح الأول في كل خطوة مجاني، والتلميح التالي يُحسب محاولة.</small>':""),"tip");
});

/* ---------- welcome modal (drops in) ---------- */
function openWelcome(first){
  $("#overlay").hidden=false;$("#wName").value=S.name;
  if(live()){
    G.fromTo("#overlay",{autoAlpha:0},{autoAlpha:1,duration:.3});
    G.fromTo("#modal",{y:-window.innerHeight*.7,rotation:-3},{y:0,rotation:0,duration:.9,ease:"bounce.out",delay:.1});
    G.fromTo("#modalAnt",{rotation:-10},{rotation:10,yoyo:true,repeat:5,duration:.28,ease:"sine.inOut",transformOrigin:"50% 90%",delay:.9});
  }
  setTimeout(()=>{try{$("#wName").focus()}catch(e){}},first?950:350);
}
$("#wName").addEventListener("input",()=>{$("#wErr").textContent="";$("#wName").removeAttribute("aria-invalid")});
$("#wForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("#wName").value.trim();
  if(!v){$("#wErr").textContent="اكتب اسمك أولًا لنبدأ";$("#wName").setAttribute("aria-invalid","true");shake($("#wName"));$("#wName").focus();return}
  const firstTime=!S.name;
  S.name=v.slice(0,20);
  $("#whoName").textContent=S.name;$("#whoAv").textContent=S.name.charAt(0);
  sfx.win();
  const done=()=>{$("#overlay").hidden=true;if(firstTime)showMenu();else nam(`أهلًا يا ${esc(S.name)}! لنكمل.`)};
  if(live())G.to("#modal",{y:-40,autoAlpha:0,duration:.3,ease:"power2.in",onComplete:()=>{G.set("#modal",{clearProps:"all"});G.to("#overlay",{autoAlpha:0,duration:.2,onComplete:()=>{done();G.set("#overlay",{clearProps:"all"})}})}});
  else done();
});
$("#whoBtn").addEventListener("click",()=>openWelcome(false));

/* ---------- life problems ---------- */
const IC={
  pencil:'<svg viewBox="0 0 24 24"><path d="M5 19l1.2-4.6L16.5 4.1l3.4 3.4L9.6 17.8z" fill="#ffd84a" stroke="#1b2a57" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 19l1.2-4.6 3.4 3.4z" fill="#f2c7a0" stroke="#1b2a57" stroke-width="1.4" stroke-linejoin="round"/><path d="M14.8 5.8l3.4 3.4" stroke="#e2553a" stroke-width="2.2"/></svg>',
  notebook:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="#2867d6"/><rect x="8" y="6" width="8" height="3" rx="1" fill="#fff"/><path d="M5 7h-1.5M5 11h-1.5M5 15h-1.5" stroke="#1b2a57" stroke-width="1.6" stroke-linecap="round"/></svg>',
  apple:'<svg viewBox="0 0 24 24"><path d="M12 8c-3-2-8-1-8 5 0 4 3 8 5 8 1.3 0 1.8-.6 3-.6s1.7.6 3 .6c2 0 5-4 5-8 0-6-5-7-8-5z" fill="#e2553a"/><path d="M12 8c0-2 1-4 3-5" stroke="#8a5a2b" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="15.5" cy="4.5" rx="2.6" ry="1.3" fill="#3f9b4a" transform="rotate(-25 15.5 4.5)"/></svg>',
  orange:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#f28c1b"/><circle cx="9.5" cy="10.5" r="1.8" fill="#fff" opacity=".35"/><ellipse cx="14" cy="4.6" rx="2.6" ry="1.3" fill="#3f9b4a" transform="rotate(-20 14 4.6)"/></svg>',
  redb:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="9.5" rx="6" ry="7.5" fill="#e2553a"/><path d="M12 17l-1.2 1.6h2.4z" fill="#e2553a"/><path d="M12 18.6c-1 1.5 1 2.5 0 4" stroke="#56628c" stroke-width="1.2" fill="none"/><ellipse cx="9.8" cy="7" rx="1.4" ry="2.2" fill="#fff" opacity=".4"/></svg>',
  blueb:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="9.5" rx="6" ry="7.5" fill="#2867d6"/><path d="M12 17l-1.2 1.6h2.4z" fill="#2867d6"/><path d="M12 18.6c-1 1.5 1 2.5 0 4" stroke="#56628c" stroke-width="1.2" fill="none"/><ellipse cx="9.8" cy="7" rx="1.4" ry="2.2" fill="#fff" opacity=".4"/></svg>',
  cookie:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="#d9a35b"/><circle cx="9" cy="9" r="1.3" fill="#5a3416"/><circle cx="14.5" cy="10" r="1.2" fill="#5a3416"/><circle cx="11" cy="14.5" r="1.3" fill="#5a3416"/><circle cx="15.5" cy="15" r="1" fill="#5a3416"/></svg>',
  juice:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="15" rx="1.5" fill="#169a68"/><rect x="8" y="10" width="8" height="6" rx="1" fill="#ffd84a"/><path d="M14 6V2.5l3-1" stroke="#1b2a57" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>',
  sbook:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5" fill="#7d4ad6"/><rect x="5" y="3" width="3" height="18" fill="#5b2fb0"/><circle cx="13.5" cy="10" r="2.6" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M13.5 12.6V16" stroke="#fff" stroke-width="1.4"/></svg>',
  story:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5" fill="#d03a72"/><rect x="5" y="3" width="3" height="18" fill="#a5205a"/><path d="M13.5 8l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z" fill="#ffd84a"/></svg>'
};

/* number line: jumps of a above (red), jumps of b below (blue), meeting point at L */
function numberLine(a,b,L,show){
  const W=340,x0=24,x1=W-24,y=70,sx=(x1-x0)/L,X=v=>x0+v*sx,sc=S.scn||SCN[0];
  let h=`<svg class="nl" id="nlA" viewBox="0 0 ${W} 140" width="${W}" style="max-width:100%" role="img" aria-label="خط الأعداد حتى ${ar(L)}">`;
  h+=`<line x1="${x0}" y1="${y}" x2="${x1+8}" y2="${y}" stroke="#1b2a57" stroke-width="2.5" stroke-linecap="round"/>`;
  if(show){
    for(let v=0;v<L;v+=a){const p=X(v),q=X(v+a),len=(q-p)*1.3;h+=`<path class="nl-jump" d="M${p},${y} Q${(p+q)/2},${y-46} ${q},${y}" fill="none" stroke="#e2553a" stroke-width="2.5" stroke-dasharray="${len} ${len}"/><text x="${q}" y="${y-16}">${v+a<L?ar(v+a):""}</text>`}
    for(let v=0;v<L;v+=b){const p=X(v),q=X(v+b),len=(q-p)*1.3;h+=`<path class="nl-jump" d="M${p},${y} Q${(p+q)/2},${y+46} ${q},${y}" fill="none" stroke="#2867d6" stroke-width="2.5" stroke-dasharray="${len} ${len}"/><text x="${q}" y="${y+28}">${v+b<L?ar(v+b):""}</text>`}
    h+=`<circle cx="${X(L)}" cy="${y}" r="15" fill="#ffd84a" stroke="#d9a90c" stroke-width="2.5"/><text class="meet" x="${X(L)}" y="${y+6}">${ar(L)}</text>`;
  }else{
    h+=`<circle cx="${x1}" cy="${y}" r="15" fill="#fff6cc" stroke="#d9a90c" stroke-width="2.5" stroke-dasharray="4 3"/><text class="meet" x="${x1}" y="${y+6}">؟</text>`;
  }
  h+=`<circle cx="${x0}" cy="${y}" r="5" fill="#1b2a57"/><text x="${x0}" y="${y+22}">٠</text>`;
  h+=`<g transform="translate(${x0-6} 6) scale(1.1)">${inner(sc.A)}</g><g transform="translate(${x0-6} 108) scale(1.1)">${inner(sc.B)}</g></svg>`;
  return h;
}

/* ---------- game flow ---------- */
function buildPlan(){
  const o=p=>Math.random()<.5?p:[p[1],p[0]];
  const e=shuffle(POOL.easy),mid=shuffle([pick(POOL.medium),pick(POOL.coprime)]);
  return [o(e[0]),o(e[1]),o(mid[0]),o(mid[1]),o(pick(POOL.hard))];
}
const FRACS=[[4,6],[6,8],[3,9],[8,10],[6,9],[4,12],[9,12],[8,12],[10,12],[5,15],[10,15],[12,16],[6,10],[12,18],[15,20],[16,20],[14,21],[18,24],[20,24],[12,20]];
const DEN=[[4,6],[6,9],[4,10]];
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
/* two questions, denominators that are not multiples of each other, common denominator ≤ 20 */
function buildFracPlan(){return shuffle(DEN).slice(0,2).map(([x,y])=>{const p=Math.random()<.5?[x,y]:[y,x];return [rnd(1,p[0]-1),p[0],rnd(1,p[1]-1),p[1]]})}
function startGame(mode){
  S.mode=mode||S.mode||"gcf";
  S.round=0;S.stars=0;S.results=[];
  S.plan=S.mode==="frac"?buildFracPlan():buildPlan();S.scns=shuffle(SCN);
  $("#starTotal").textContent=ar(0);$("#final").hidden=true;$("#menu").hidden=true;$("#game").hidden=false;
  startRound();
  if(S.mode==="frac")nam(`لنقارن الكسور يا ${esc(S.name)}! ابحث بالنظر عن أصغر مضاعف مشترك للمقامين.`);
  else if(S.mode==="story")nam(`أهلًا يا ${esc(S.name)}! اقرأ المسألة أولًا.`);
  else nam(`أهلًا يا ${esc(S.name)}! لنكشف معًا المضاعف المشترك الأصغر. ابدأ بتحليل العدد الأول.`);
}
const FLOW=()=>{
  const [a,b]=S.pair;
  if(S.mode==="frac")return [["م.م.أ بالنظر",lcdFind],["توحيد المقامين",lcdConvert],["المقارنة",lcdCompare]];
  const core=[[`تحليل ${ar(a)}`,()=>analyze(a)],[`تحليل ${ar(b)}`,()=>analyze(b)],["العوامل المشتركة",stepMatch],["م.م.أ",stepAnswer]];
  return S.mode==="story"?[["المسألة",stepStory]].concat(core):core;
};
const STEPS=()=>FLOW().map(x=>x[0]);
function startRound(){
  S.pair=S.plan[S.round];S.slips=0;S.L=0;S.scn=S.scns[S.round%S.scns.length];
  $("#roundLabel").textContent=`الجولة ${ar(S.round+1)}`;
  $("#roundTitle").innerHTML=S.mode==="frac"?`أي الكسرين أكبر: <span class="frac" style="font-size:26px"><span>${ar(S.pair[0])}</span><span>${ar(S.pair[1])}</span></span> أم <span class="frac" style="font-size:26px"><span>${ar(S.pair[2])}</span><span>${ar(S.pair[3])}</span></span>؟`:`ما المضاعف المشترك الأصغر للعددين <span class="pair-n">${ar(S.pair[0])}</span> و <span class="pair-n">${ar(S.pair[1])}</span>؟`;
  $("#roundBar").innerHTML=S.plan.map((_,i)=>`<i class="${i<S.round?"done":i===S.round?"now":""}"></i>`).join("");
  T.from(".rhead",{y:10,autoAlpha:0});
  goStep(0);
}
function renderStepper(){$("#stepper").innerHTML=STEPS().map((n,i)=>`<li class="${i<S.step?"done":i===S.step?"now":""}"${i===S.step?' aria-current="step"':""}>${n}</li>`).join("")}
function goStep(i){
  S.step=i;S.hintFn=null;S.hints=0;renderStepper();

}

/* =========================================================
   Factor tree: type two factors, decide prime or not, primes become fruit
   ========================================================= */
const NS="http://www.w3.org/2000/svg";
const mk=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};
const LW=70,LH=88;
let TR=null;
const TI={a:"",b:"",act:"a",nd:null};
function treeStart(n){
  $("#work").innerHTML=`
    <div class="stage two">
      <div class="treebox"><svg id="tree" viewBox="-180 -70 360 200" role="img" aria-label="شجرة عوامل العدد ${ar(n)}"><g id="trBr"></g><g id="trNd"></g></svg></div>
      <div class="side">
        <p class="ask" id="trAsk"></p>
        <div id="trIn" hidden style="display:grid;gap:12px">
          <div class="pairin"><b id="pn"></b><span>=</span><span class="pbox act" id="pa" role="button" tabindex="0" aria-label="العامل الأول">؟</span><span>×</span><span class="pbox" id="pb" role="button" tabindex="0" aria-label="العامل الثاني">؟</span></div>
          <div class="pad" id="trPad" dir="ltr" role="group" aria-label="لوحة الأرقام">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" class="key" data-k="${k}">${ar(k)}</button>`).join("")}<button type="button" class="key fn" data-k="del">حذف</button><button type="button" class="key" data-k="0">٠</button><button type="button" class="key go" data-k="ok">تحقّق</button></div>
        </div>
        <div class="opts" id="trOpts" role="group" aria-label="اختر الإجابة"></div>
      </div>
    </div>`;
  TR={n,root:null,nodes:[],Q:[],S:[],vb:[-180,-70,360,200],done:false};
  TR.root=addNode(n,null);TR.root.state="comp";face(TR.root);TR.S=[TR.root];
  trLayout();
  T.from(TR.root.g,{scale:0,transformOrigin:"50% 50%",duration:.5,ease:"back.out(2)"});
  $("#trPad").addEventListener("click",e=>{const k=e.target.closest(".key");if(k)tiKey(k.dataset.k)});
  [["#pa","a"],["#pb","b"]].forEach(([s,c])=>{const el=$(s);el.addEventListener("click",()=>{TI.act=c;tiShow()});el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();TI.act=c;tiShow()}})});
  trNext();
}
function face(nd){
  const r=nd===TR.root?28:24,v=ar(nd.v);
  if(nd.state==="prime"){
    nd.g.innerHTML='<g class="fr"><path class="stem" d="M0,-23 Q2,-31 6,-36"/><ellipse class="fleaf" cx="12" cy="-33" rx="8" ry="4" transform="rotate(-25 12 -33)"/>'+
      '<circle r="25" style="fill:'+(FRUIT[nd.v]||"var(--c2)")+'"/><ellipse cx="-9" cy="-9" rx="6" ry="4" fill="#fff" opacity=".35"/><text class="tnum fruitnum" y="1">'+v+"</text></g>";
    return;
  }
  let crown="";
  if(nd===TR.root){crown='<g class="crown">';[[-34,-6,-30],[34,-6,30],[-22,-28,-60],[22,-28,60],[0,-36,0]].forEach(c=>crown+='<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="16" ry="8" transform="rotate('+c[2]+" "+c[0]+" "+c[1]+')" opacity=".9"/>');crown+="</g>"}
  nd.g.innerHTML=crown+'<circle class="ring" r="'+(r+7)+'"/><circle class="knot" r="'+r+'"/><text class="tnum" y="1"'+(nd===TR.root?' style="font-size:24px"':"")+">"+v+"</text>";
}
function addNode(v,parent){
  const nd={v,parent,kids:[],depth:parent?parent.depth+1:0,state:"new",px:parent?parent.px:0,py:parent?parent.py:0};
  if(parent){nd.br=mk("path",{class:"branch","stroke-width":Math.max(3,8-nd.depth*1.5)});$("#trBr").appendChild(nd.br);nd.leaf=mk("ellipse",{class:"tleaf",rx:8,ry:4});$("#trBr").appendChild(nd.leaf)}
  nd.g=mk("g",{class:"tnode"});$("#trNd").appendChild(nd.g);
  TR.nodes.push(nd);face(nd);return nd;
}
function trDraw(){
  TR.nodes.forEach(nd=>{
    nd.g.setAttribute("transform","translate("+nd.px+","+nd.py+")");
    if(nd.parent){
      const p=nd.parent,x1=p.px,y1=p.py+(p===TR.root?28:24),x2=nd.px,y2=nd.py-(nd.state==="prime"?36:24),my=(y1+y2)/2;
      nd.br.setAttribute("d","M"+x1+","+y1+" C"+x1+","+my+" "+x2+","+(my-8)+" "+x2+","+y2);
      nd.leaf.setAttribute("transform","translate("+((x1+x2)/2+(x2<x1?-6:6))+","+my+") rotate("+(x2<x1?35:-35)+")");
    }
  });
  $("#tree").setAttribute("viewBox",TR.vb.map(v=>v.toFixed(1)).join(" "));
}
function trLayout(){
  let li=0,maxD=0;
  const walk=nd=>{maxD=Math.max(maxD,nd.depth);if(!nd.kids.length){nd.tx=li++*LW}else{nd.kids.forEach(walk);nd.tx=(nd.kids[0].tx+nd.kids[1].tx)/2}nd.ty=nd.depth*LH};
  walk(TR.root);
  const xs=TR.nodes.map(n=>n.tx),cx=(Math.min(...xs)+Math.max(...xs))/2;
  TR.nodes.forEach(n=>n.tx=-(n.tx-cx)); /* mirror so the first factor sits on the right (RTL) */
  const w=Math.max(300,Math.max(...xs)-Math.min(...xs)+110),h=maxD*LH+120;
  const to=[-w/2,-72,w,h],from=TR.vb.slice();
  TR.nodes.forEach(n=>{n.fx=n.px;n.fy=n.py});
  const set=t=>{TR.nodes.forEach(n=>{n.px=n.fx+(n.tx-n.fx)*t;n.py=n.fy+(n.ty-n.fy)*t});TR.vb=from.map((v,i)=>v+(to[i]-v)*t);trDraw()};
  if(live()){const o={t:0};G.to(o,{t:1,duration:.7,ease:"power2.out",onUpdate:()=>set(o.t)})}else set(1);
}
function setCur(nd){TR.nodes.forEach(n=>n.g.classList.toggle("cur",n===nd))}
function trNext(){
  if(TR.Q.length){autoClassify();return T.later(TR.S.length?.9:1.1,trNext)}
  if(TR.S.length)return askSplit(TR.S.shift());
  askFinal();
}
function tiShow(){
  const pa=$("#pa"),pb=$("#pb");if(!pa)return;
  pa.textContent=TI.a?ar(TI.a):"؟";pb.textContent=TI.b?ar(TI.b):"؟";
  pa.classList.toggle("act",TI.act==="a");pb.classList.toggle("act",TI.act==="b");
  pa.classList.toggle("filled",!!TI.a);pb.classList.toggle("filled",!!TI.b);
}
function tiKey(k){
  const nd=TI.nd;if(!nd)return;
  if(k==="ok")return tiCheck(true);
  const c=TI.act,n=nd.v;
  if(k==="del"){if(!TI[c]&&c==="b")TI.act="a";else TI[c]=TI[c].slice(0,-1);return tiShow()}
  if(TI[c].length>=2)return;
  TI[c]=(TI[c]==="0"?"":TI[c])+k;
  if(c==="a"&&+TI.a*10>n/2&&+TI.a>0)TI.act="b";
  tiShow();
  if(c==="a"&&TI.a==="0")return tiWrong("الضرب في ٠ يعطي ٠، وليس "+ar(n)+".",true);
  if(c==="b"&&TI.b)tiCheck(false);
}
function tiWrong(m,both){
  nam(m,"bad");shake([$("#pa"),$("#pb")]);
  setTimeout(()=>{if(!TI.nd)return;TI.b="";if(both){TI.a="";TI.act="a"}else TI.act="b";tiShow()},650);
}
function tiCheck(forced){
  const nd=TI.nd,n=nd.v,a=+TI.a,b=+TI.b;
  if(!TI.a){TI.act="a";TI.b="";tiShow();if(forced)nam("اكتب العامل الأول في الخانة الأولى.","tip");return}
  if(!TI.b){TI.act="b";tiShow();if(forced)nam("اكتب العامل الثاني في الخانة الثانية.","tip");return}
  if(a===1||b===1&&(forced||TI.b.length>=String(n).length))return tiWrong("الضرب في ١ لا يحلّل العدد. اكتب عددين أكبر من ١.",a===1);
  if(b===0)return tiWrong("الضرب في ٠ يعطي ٠، وليس "+ar(n)+".");
  if(a*b===n){TI.nd=null;setTimeout(()=>{$("#trIn").hidden=true;doSplit(nd,a,b)},300);return}
  const need=String(Math.max(1,Math.floor(n/a))).length;
  if(forced||a*b>n||TI.b.length>=need){
    if(n%a)return tiWrong(ar(a)+" لا يقسم "+ar(n)+" بدون باقٍ، فلا يمكن أن يكون أحد العاملين.",true);
    return tiWrong(ar(a)+" × "+ar(b)+" = "+ar(a*b)+"، وليس "+ar(n)+".");
  }
}
function askSplit(nd){
  setCur(nd);$("#trOpts").hidden=true;
  $("#trAsk").innerHTML="اكتب عددين حاصل ضربهما <b>"+ar(nd.v)+"</b><small>اضغط أي خانة لتكتب فيها.</small>";
  $("#pn").textContent=ar(nd.v);
  Object.assign(TI,{a:"",b:"",act:"a",nd});tiShow();$("#trIn").hidden=false;
  T.from("#trIn",{autoAlpha:0,y:10,duration:.3});view($("#trIn").closest(".side"));
  S.hintFn=()=>{const d=spf(nd.v);return ar(nd.v)+" = "+ar(d)+" × ؟ &nbsp;(كم "+ar(d)+" في "+ar(nd.v)+"؟)"};
}
function doSplit(nd,a,b){
  nd.state="split";
  nd.kids=[addNode(a,nd),addNode(b,nd)];TR.Q.push(nd.kids[0],nd.kids[1]);
  trLayout();
  nam(ar(a)+" × "+ar(b)+" = "+ar(nd.v)+". نبت للشجرة فرعان جديدان.","ok");
  T.later(1.1,trNext);
}
function offerTo(items,judge){
  const box=$("#trOpts");box.innerHTML="";box.hidden=false;
  items.forEach(it=>{
    const b=document.createElement("button");b.type="button";b.className="tile "+(it.cls||"");b.innerHTML=it.label;
    b.addEventListener("click",()=>{
      if(b.disabled)return;
      const olds=[...box.querySelectorAll("button")];
      if(judge(it.val,b)){b.classList.add("right");pop(b);olds.forEach(x=>x.disabled=true)}
      else{b.disabled=true;b.classList.add("no");shake(b)}
    });
    box.appendChild(b);
  });
  T.from(box.children,{autoAlpha:0,y:10,stagger:.05,duration:.25});
  view(box.closest(".side"));
}
function primeWhy(v){
  if(v%2===0)return "العدد زوجي، إذن يقبل القسمة على ٢.";
  if(String(v).split("").reduce((s,d)=>s+ +d,0)%3===0)return "مجموع أرقامه يقبل القسمة على ٣.";
  if(v%5===0)return "آحاده ٠ أو ٥، إذن يقبل القسمة على ٥.";
  if(v%7===0)return "جرّب القسمة على ٧.";
  return "هل يقبل القسمة على عدد غير ١ ونفسه؟";
}
function autoClassify(){
  /* primes turn into fruit on their own; non-primes queue up to be split next */
  const batch=TR.Q.splice(0),fruits=[];
  batch.forEach(nd=>{
    if(isPrime(nd.v)){nd.state="prime";face(nd);fruits.push(nd)}
    else{nd.state="comp";face(nd);TR.S.push(nd)}
  });
  trDraw();
  fruits.forEach((nd,i)=>{
    const fr=nd.g.querySelector(".fr");
    if(live()){G.fromTo(fr,{scale:0,transformOrigin:"50% 50%"},{scale:1,duration:.55,ease:"back.out(2.4)",delay:i*.15});G.fromTo(fr,{rotation:-10},{rotation:10,yoyo:true,repeat:3,duration:.16,delay:.45+i*.15,transformOrigin:"50% 0%"})}
  });
  const pv=fruits.map(n=>ar(n.v)),cv=batch.filter(n=>!isPrime(n.v)).map(n=>ar(n.v));
  let m="";
  if(pv.length)m+=pv.join(" و ")+(pv.length>1?" أعداد أولية، صارت ثمارًا. ":" عدد أولي، صار ثمرة. ");
  if(cv.length)m+=cv.join(" و ")+(cv.length>1?" غير أولية، سنحلّلها.":" غير أولي، سنحلّله.");
  if(m)nam(m,pv.length?"ok":"");
}
/* each prime fruit leaves the tree and lines up in the factorization */
function flyFruits(res,f){
  const chips=[...res.querySelectorAll(".eq .chip")];
  const pool=TR.nodes.filter(nd=>nd.state==="prime").map(nd=>({v:nd.v,el:nd.g.querySelector(".fr")}));
  chips.forEach((c,i)=>{
    const k=pool.findIndex(p=>p.v===f[i]);if(k<0)return;
    const fr=pool.splice(k,1)[0].el,r1=fr.getBoundingClientRect(),r2=c.getBoundingClientRect();
    G.fromTo(c,{x:r1.left+r1.width/2-(r2.left+r2.width/2),y:r1.top+r1.height/2-(r2.top+r2.height/2),scale:1.2},{x:0,y:0,scale:1,duration:.8,ease:"power2.inOut",delay:.2+i*.22});
    G.to(fr,{opacity:.3,duration:.3,delay:.2+i*.22});
  });
}
function askFinal(){
  /* every branch ends in a prime: harvest the fruit straight into the factorization */
  setCur(null);$("#trIn").hidden=true;$("#trOpts").hidden=true;TR.done=true;
  $("#trAsk").innerHTML="كل أطراف الشجرة ثمار أولية. شاهد الثمار وهي تصطف أمامك!";
  nam("نضجت الثمار الأولية، وها هي تنزل وتصطف: حاصل ضربها يساوي "+ar(TR.n)+".","ok");
  const frs=[...document.querySelectorAll("#trNd .fr")];
  if(live())G.fromTo(frs,{rotation:-8},{rotation:8,yoyo:true,repeat:3,duration:.14,transformOrigin:"50% 0%"});
  T.later(.6,()=>analysisDone(TR.n));
}

/* =========================================================
   Repeated division ladder: choose a prime, then find the quotient
   (place by place when the quotient is 10 or more)
   ========================================================= */
let LD=null;
const near=(ans,lo,hi)=>{const s=[ans];[ans+1,ans-1,ans+2,ans-2,ans+3,ans-3].forEach(x=>{if(x>=lo&&x<=hi&&s.indexOf(x)<0&&s.length<4)s.push(x)});return s.sort((a,b)=>a-b)};
function ladderStart(n){
  $("#work").innerHTML=`
    <div class="stage two">
      <div class="ladder" id="ld"><div class="lhead"><span>العدد</span><span>العامل الأولي</span></div></div>
      <div class="side">
        <p class="ask" id="ldAsk"></p>
        <div class="opts" id="ldOpts" role="group" aria-label="اختر الإجابة"></div>
      </div>
    </div>`;
  LD={n,cur:n,p:0,row:null,next:null};
  LD.row=makeRow(n);
  T.from("#ld .lrow",{autoAlpha:0,y:-12});
  askLPrime();
}
function makeRow(v){
  const el=document.createElement("div");el.className="lrow";
  const s=v==null?"":String(v);
  el.innerHTML=`<span class="numc">${s.split("").map(d=>`<span class="dg">${ar(d)}</span>`).join("")}</span><span class="pr"></span>`;
  $("#ld").appendChild(el);
  return {el,num:el.querySelector(".numc"),pr:el.querySelector(".pr"),ds:[...el.querySelectorAll(".dg")]};
}
function ldOffer(vals,judge,labelFn){
  const box=$("#ldOpts");box.innerHTML="";
  vals.forEach(v=>{
    const b=document.createElement("button");b.type="button";b.className="tile";b.textContent=labelFn?labelFn(v):ar(v);b.dataset.v=v;
    b.addEventListener("click",()=>{
      if(b.disabled)return;
      if(judge(v)){b.classList.add("right");pop(b);box.querySelectorAll("button").forEach(x=>x.disabled=true)}
      else{b.disabled=true;b.classList.add("no");shake(b)}
    });
    box.appendChild(b);
  });
  T.from(box.children,{autoAlpha:0,y:10,stagger:.04,duration:.25});
  view(box.closest(".side"));
}
function whyNot(c,p){
  if(p===2)return ar(p)+" لا يقسم "+ar(c)+"، لأن "+ar(c)+" عدد فردي.";
  if(p===3){const s=String(c).split("").reduce((a,d)=>a+ +d,0);return ar(p)+" لا يقسم "+ar(c)+"، لأن مجموع أرقامه "+ar(s)+" لا يقبل القسمة على ٣."}
  if(p===5)return ar(p)+" لا يقسم "+ar(c)+"، لأن آحاده "+ar(c%10)+" وليس ٠ أو ٥.";
  return ar(p)+" لا يقسم "+ar(c)+" بدون باقٍ.";
}
function askLPrime(){
  LD.row.pr.innerHTML='<span class="slot">؟</span>';
  $("#ldAsk").innerHTML="على أي عدد أولي نقسم <b>"+ar(LD.cur)+"</b>؟<small>ابدأ بأصغر الأعداد الأولية: ٢ ثم ٣ ثم ٥ ثم ٧.</small>";
  S.hintFn=()=>primeWhy(LD.cur);
  ldOffer([2,3,4,5,7],v=>{
    const c=LD.cur;
    if(!isPrime(v)){nam(ar(v)+" ليس عددًا أوليًا، لأن "+ar(v)+" = "+times(factors(v))+".","bad");return false}
    if(c%v){nam(whyNot(c,v),"bad");return false}
    const note=v!==spf(c)?"صحيح، لكن الأصغر هو "+ar(spf(c))+". نكمل بـ"+ar(v)+".":"";
    setLPrime(v,note);return true;
  });
}
function setLPrime(p,note){
  LD.p=p;LD.row.pr.innerHTML='<b class="pv">'+ar(p)+"</b>";pop(LD.row.pr.firstChild);
  LD.next=makeRow(null);T.from(LD.next.el,{autoAlpha:0,y:-20,duration:.4});view(LD.next.el);
  const c=LD.cur,q=c/p;
  if(note)nam(note,"tip");else nam("نقسم "+ar(c)+" على "+ar(p)+".","ok");
  if(q<10){
    LD.row.ds.forEach(d=>d.classList.add("lit"));
    LD.next.num.innerHTML='<span class="dg box">؟</span>';
    T.later(.35,()=>askWhole(c,p,q));
  }else{
    /* two-digit quotient: tens first, then the ones */
    LD.next.num.innerHTML='<span class="dg box">؟</span><span class="dg box">؟</span>';
    T.later(.35,()=>askTens(c,p));
  }
}
function askWhole(c,p,q){
  $("#ldAsk").innerHTML="كم <b>"+ar(p)+"</b> في <b>"+ar(c)+"</b>؟<small>"+ar(c)+" ÷ "+ar(p)+" = ؟</small>";
  S.hintFn=()=>ar(p)+" × ؟ = "+ar(c);
  ldOffer(near(q,1,9),v=>{
    if(v!==q){nam(ar(v)+" × "+ar(p)+" = "+ar(v*p)+"، وليس "+ar(c)+". "+(v*p>c?"جرّب عددًا أصغر.":"جرّب عددًا أكبر."),"bad");return false}
    LD.next.num.innerHTML='<span class="dg">'+ar(q)+"</span>";pop(LD.next.num.firstChild);
    rowDone();return true;
  });
}
function askTens(c,p){
  const t=Math.floor(c/10),u=c%10,q1=Math.floor(t/p),r=t%p;
  LD.row.ds.forEach((d,i)=>d.classList.toggle("lit",i===0));
  $("#ldAsk").innerHTML="نبدأ بخانة العشرات: كم <b>"+ar(p)+"</b> في الـ<b>"+ar(t)+"</b>؟";
  S.hintFn=()=>ar(p)+" × ؟ يقترب من "+ar(t)+" دون أن يتجاوزه.";
  ldOffer(near(q1,0,9),v=>{
    if(v!==q1){const m=v*p;nam(m>t?ar(v)+" × "+ar(p)+" = "+ar(m)+"، وهذا أكثر من "+ar(t)+". جرّب عددًا أصغر.":ar(v)+" × "+ar(p)+" = "+ar(m)+"، ويبقى "+ar(t-m)+"، وهذا يكفي لـ"+ar(p)+" أخرى. جرّب عددًا أكبر.","bad");return false}
    const box=LD.next.num.children[0];box.className="dg";box.textContent=ar(q1);pop(box);
    if(r===0){nam(ar(q1)+" × "+ar(p)+" = "+ar(q1*p)+"، ولا يبقى شيء.","ok");T.later(.7,()=>askOnes(c,p,u,u));}
    else T.later(.5,()=>askRem(c,p,t,q1,r,u));
    return true;
  });
}
function askRem(c,p,t,q1,r,u){
  $("#ldAsk").innerHTML=ar(q1)+" × "+ar(p)+" = "+ar(q1*p)+". كم يبقى من الـ<b>"+ar(t)+"</b>؟";
  S.hintFn=()=>ar(t)+" − "+ar(q1*p)+" = ؟";
  ldOffer(near(r,0,Math.max(p-1,3)),v=>{
    if(v!==r){nam(ar(t)+" − "+ar(q1*p)+" = "+ar(r)+"، وليس "+ar(v)+".","bad");return false}
    const ones=LD.row.ds[1];const cb=document.createElement("span");cb.className="cb";cb.textContent=ar(r);ones.appendChild(cb);pop(cb);
    const part=r*10+u;
    nam("الـ"+ar(r)+" الباقي ينتقل إلى خانة الآحاد، فيصبح معنا "+ar(part)+".","ok");
    T.later(.8,()=>askOnes(c,p,part,u));
    return true;
  });
}
function askOnes(c,p,part,u){
  LD.row.ds.forEach((d,i)=>d.classList.toggle("lit",i===1));
  const q2=part/p;
  $("#ldAsk").innerHTML="خانة الآحاد: كم <b>"+ar(p)+"</b> في الـ<b>"+ar(part)+"</b>؟";
  S.hintFn=()=>ar(p)+" × ؟ = "+ar(part);
  ldOffer(near(q2,0,9),v=>{
    if(v!==q2){nam(ar(v)+" × "+ar(p)+" = "+ar(v*p)+"، وليس "+ar(part)+".","bad");return false}
    const box=LD.next.num.children[1];box.className="dg";box.textContent=ar(q2);pop(box);
    rowDone();return true;
  });
}
function rowDone(){
  const prev=LD.cur,p=LD.p,q=prev/p;
  LD.row.ds.forEach(d=>d.classList.remove("lit"));
  LD.cur=q;LD.row=LD.next;LD.row.ds=[...LD.row.el.querySelectorAll(".dg")];LD.next=null;
  if(q===1){
    LD.row.el.classList.add("end");$("#ldOpts").innerHTML="";$("#ldAsk").innerHTML="وصلنا إلى ١";
    nam("اكتمل السُّلَّم. العمود الأيسر هو العوامل الأولية للعدد "+ar(LD.n)+".","ok");
    const pv=document.querySelectorAll("#ld .pv");
    if(live()){const tl=G.timeline();pv.forEach((e,i)=>tl.call(()=>e.classList.add("lit"),null,i*.16))}else pv.forEach(e=>e.classList.add("lit"));
    analysisDone(LD.n);return;
  }
  nam(ar(prev)+" ÷ "+ar(p)+" = "+ar(q)+". نكرّر القسمة على "+ar(q)+".","ok");
  T.later(.6,askLPrime);
}

/* =========================================================
   Step 3: highlight the common factors
   ========================================================= */
function commonList(a,b){const fb=factors(b).slice(),c=[];factors(a).forEach(p=>{const i=fb.indexOf(p);if(i>-1){c.push(p);fb.splice(i,1)}});return c}
let MT=null;
function stepMatch(){
  const [a,b]=S.pair;
  MT={f:[factors(a),factors(b)],sel:null,pairs:0,lines:[]};
  const row=(r,n)=>`<div class="mrow"><div class="lbl">${ar(n)}</div><div class="mchips">${MT.f[r].map((p,i)=>`<button type="button" class="chip" style="--c:${FRUIT[p]}" data-r="${r}" data-i="${i}" aria-label="العامل ${ar(p)} من العدد ${ar(n)}">${ar(p)}</button>`).join('<span class="times">×</span>')}</div></div>`;
  $("#stage").innerHTML=`
    <div class="ptitle"><span class="sym" style="--c:var(--c5)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></span><div><h3>ظلّل العوامل المشتركة</h3><p>ضع إصبعك على عامل، واسحب كأنك تمسك قلم تظليل حتى تصل إلى العامل المساوي له في العدد الآخر.</p></div></div>
    <div class="mrows">${row(0,a)}${row(1,b)}<svg class="ink" id="ink" aria-hidden="true"></svg></div><div class="cbox" id="cbox" style="margin-top:12px"><span class="cbox-lbl">صندوق العوامل المشتركة</span><div class="cbox-in" id="cboxIn"><span class="ph">ظلّل كل عاملين متساويين بسحبة واحدة، فيظهران هنا.</span></div></div>
    <div class="actions" style="margin-top:16px"><button type="button" class="btn" id="noneMatch">لا يوجد ما أظلّله</button><button type="button" class="btn primary" id="doneMatch">انتهيت من التظليل</button></div>`;
  $("#stage").querySelector(".mrows").addEventListener("click",e=>{if(MT.dragged)return;const c=e.target.closest(".mchips .chip");if(c&&!c.classList.contains("hl"))tapChip(+c.dataset.r,+c.dataset.i,c)});
  enableDrag();
  $("#doneMatch").addEventListener("click",finishMatch);
  $("#noneMatch").addEventListener("click",()=>{
    const c=commonList(a,b);
    if(!c.length){sfx.ok();nam(`صحيح! لا يوجد عامل أولي مشترك بين ${ar(a)} و ${ar(b)}، فسنضرب كل العوامل.`,"ok");$("#noneMatch").disabled=true;T.later(1.4,()=>goStep(S.step+1));return}
    shake($("#noneMatch"));
    nam(MT.pairs?"ما زال هناك عامل مشترك لم تظلّله. انظر جيدًا إلى الصفين.":`انظر جيدًا: العدد ${ar(c[0])} يظهر في الصفين. ظلّله.`,"bad");
  });
  T.from("#stage .mrow",{y:14,autoAlpha:0,stagger:.08});setTimeout(()=>view($("#doneMatch")),450);
  nam("اسحب قلم التظليل من عامل إلى العامل المساوي له في العدد الآخر. يمكنك أيضًا الضغط على العاملين.");
  if(!commonList(a,b).length){S.hintFn=()=>"قارن الصفين: هل ترى العدد نفسه فيهما؟ إذا لم تجده، اضغط «لا يوجد ما أظلّله».";return}
  S.hintFn=()=>{const usedA=[...document.querySelectorAll('.chip.hl[data-r="0"]')].map(c=>+c.dataset.i);const fb=MT.f[1].filter((_,j)=>!document.querySelector(`.chip.hl[data-r="1"][data-i="${j}"]`));const i=MT.f[0].findIndex((p,k)=>usedA.indexOf(k)<0&&fb.indexOf(p)>-1);return i<0?"وجدت كل العوامل المشتركة. اضغط «انتهيت».":"ابحث عن "+ar(MT.f[0][i])+" في الصفين."};
}
function centerOf(el){const r=el.getBoundingClientRect(),o=$("#stage .mrows").getBoundingClientRect();return [r.left+r.width/2-o.left,r.top+r.height/2-o.top]}
function drawInk(animLast){
  const svg=$("#ink");if(!svg)return;
  svg.innerHTML=MT.lines.map(([p,q])=>{const [x1,y1]=centerOf(p),[x2,y2]=centerOf(q);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join("");
  if(animLast&&live()){const l=svg.lastElementChild,len=Math.hypot(l.x2.baseVal.value-l.x1.baseVal.value,l.y2.baseVal.value-l.y1.baseVal.value);G.fromTo(l,{attr:{"stroke-dasharray":len+" "+len,"stroke-dashoffset":len}},{attr:{"stroke-dashoffset":0},duration:.35,ease:"power2.out"})}
}
window.addEventListener("resize",()=>{if(MT&&$("#ink"))drawInk(false)});
function enableDrag(){
  const root=$("#stage .mrows");
  root.addEventListener("pointerdown",e=>{
    const c=e.target.closest(".mchips .chip");if(!c||c.classList.contains("hl")||e.button>0)return;
    const svg=$("#ink"),st={x0:e.clientX,y0:e.clientY,moved:false,line:null};
    const clearOver=()=>root.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
    const target=ev=>{const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest(".mchips .chip");return tg&&tg!==c&&tg.dataset.r!==c.dataset.r&&!tg.classList.contains("hl")?tg:null};
    try{c.setPointerCapture(e.pointerId)}catch(_){}
    const move=ev=>{
      if(!st.moved&&Math.hypot(ev.clientX-st.x0,ev.clientY-st.y0)>7){
        st.moved=true;if(MT.sel){chipEl(MT.sel.r,MT.sel.i).classList.remove("sel");MT.sel=null}
        const [x,y]=centerOf(c);st.line=document.createElementNS("http://www.w3.org/2000/svg","line");st.line.setAttribute("class","live");st.line.setAttribute("x1",x);st.line.setAttribute("y1",y);svg.appendChild(st.line);
      }
      if(!st.moved)return;
      const o=root.getBoundingClientRect();st.line.setAttribute("x2",ev.clientX-o.left);st.line.setAttribute("y2",ev.clientY-o.top);
      clearOver();const tg=target(ev);if(tg)tg.classList.add("over");
    };
    const up=ev=>{
      c.removeEventListener("pointermove",move);c.removeEventListener("pointerup",up);c.removeEventListener("pointercancel",up);
      if(!st.moved)return;
      MT.dragged=true;setTimeout(()=>MT.dragged=false,60);clearOver();
      const tg=target(ev),ln=st.line;
      if(tg&&MT.f[+c.dataset.r][+c.dataset.i]===MT.f[+tg.dataset.r][+tg.dataset.i]){ln.remove();MT.sel={r:+c.dataset.r,i:+c.dataset.i};tapChip(+tg.dataset.r,+tg.dataset.i,tg);return}
      if(tg){ln.setAttribute("class","bad");MT.sel={r:+c.dataset.r,i:+c.dataset.i};tapChip(+tg.dataset.r,+tg.dataset.i,tg)}
      else nam("اسحب حتى تصل إلى العامل المساوي له في العدد الآخر.","tip");
      if(live())G.to(ln,{opacity:0,duration:.5,delay:.2,onComplete:()=>ln.remove()});else ln.remove();
    };
    c.addEventListener("pointermove",move);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  });
}
const chipEl=(r,i)=>$(`.mchips .chip[data-r="${r}"][data-i="${i}"]`);
function tapChip(r,i,el){
  if(!MT.sel||MT.sel.r===r){
    if(MT.sel)chipEl(MT.sel.r,MT.sel.i).classList.remove("sel");
    if(MT.sel&&MT.sel.r===r&&MT.sel.i===i){MT.sel=null;return}
    MT.sel={r,i};el.classList.add("sel");return;
  }
  const other=chipEl(MT.sel.r,MT.sel.i),v1=MT.f[MT.sel.r][MT.sel.i],v2=MT.f[r][i];
  other.classList.remove("sel");
  if(v1===v2){
    MT.pairs++;
    [other,el].forEach(c=>{c.classList.add("hl");c.setAttribute("aria-disabled","true");c.insertAdjacentHTML("beforeend",`<span class="badge">${ar(MT.pairs)}</span>`)});
    T.fromTo([other,el],{scale:.8},{scale:1,duration:.4,ease:"back.out(2)"});
    MT.lines.push([other,el]);drawInk(true);
    const ph=$("#cboxIn .ph");if(ph)ph.remove();
    $("#cboxIn").insertAdjacentHTML("beforeend",(MT.pairs>1?'<span class="times">×</span>':"")+chip(v1,"hl"));
    /* the highlighted factor drops into the box by itself, like picked fruit */
    const nc=$("#cboxIn").lastElementChild;
    if(live()){const r1=el.getBoundingClientRect(),r2=nc.getBoundingClientRect();G.fromTo(nc,{x:r1.left-r2.left,y:r1.top-r2.top,scale:1.25},{x:0,y:0,scale:1,duration:.75,ease:"power2.inOut",delay:.15})}
    nam(ar(v1)+" عامل مشترك بين العددين.","ok");
  }else{
    shake([other,el]);nam(ar(v1)+" لا يساوي "+ar(v2)+". اختر عاملين متساويين.","bad");
  }
  MT.sel=null;
}
function finishMatch(){
  const need=commonList(...S.pair).length;
  if(need===0){shake($("#doneMatch"));nam("لم تظلّل أي عامل. إذا لم تجد عددًا يتكرر في الصفين، اضغط «لا يوجد ما أظلّله».","tip");return}
  if(MT.pairs<need){shake($("#doneMatch"));nam("ما زال هناك عامل مشترك لم تجده. انظر إلى العددين مرة أخرى.","bad");return}
  goStep(S.step+1);
}

/* =========================================================
   Step 4: the GCF
   ========================================================= */
const minus=(f,c)=>{const r=f.slice();c.forEach(p=>{const i=r.indexOf(p);if(i>-1)r.splice(i,1)});return r};
function unionOf(a,b){const c=commonList(a,b);return {c,ra:minus(factors(a),c),rb:minus(factors(b),c)}}
function stepAnswer(){
  const [a,b]=S.pair,{c,ra,rb}=unionOf(a,b),all=c.concat(ra,rb);
  S.ans="";S.ansTries=0;
  const row=(n,r)=>{const left=c.slice();return `<div class="mrow"><div class="lbl">${ar(n)}</div><div class="mchips">${factors(n).map(p=>{const i=left.indexOf(p),h=i>-1;if(h)left.splice(i,1);return `<span class="chip ${h?"hl":""}" style="--c:${FRUIT[p]}" data-r="${r}" data-h="${h?1:0}">${ar(p)}</span>`}).join('<span class="times">×</span>')}</div></div>`};
  $("#stage").innerHTML=`
    <div class="ptitle"><span class="sym" style="--c:var(--c4)">×</span><div><h3>احسب المضاعف المشترك الأصغر</h3><p>المشترك ينزل مرة واحدة، ثم تنزل كل العوامل الباقية من العددين.</p></div></div>
    <div class="answer">
      <div class="mrows" style="width:100%">${row(a,0)}${row(b,1)}</div>
      <div class="cbox" style="width:100%"><span class="cbox-lbl">م.م.أ</span><div class="cbox-in" id="uLine">${c.map(p=>chip(p,"hl")).concat(ra.concat(rb).map(p=>chip(p))).join('<span class="times">×</span>')}</div></div>
      <div class="ans-eq"><span>م.م.أ (<span class="num">${ar(a)}</span> ، <span class="num">${ar(b)}</span>) =</span><div class="ans-box empty" id="ansBox" aria-live="polite">؟</div></div>
      <div class="pad" dir="ltr" id="ansPad" role="group" aria-label="لوحة الأرقام">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" class="key" data-k="${d}">${ar(d)}</button>`).join("")}<button type="button" class="key fn" data-k="del">حذف</button><button type="button" class="key" data-k="0">٠</button><button type="button" class="key go" data-k="ok">تحقّق</button></div>
    </div>`;
  $("#ansPad").addEventListener("click",e=>{const k=e.target.closest(".key");if(k)press(k.dataset.k)});
  /* sources: common from the first number, then what is left in each number; the second copy of a common factor stays behind */
  const A=[...$("#stage").querySelectorAll('.mrows .chip[data-r="0"]')],B=[...$("#stage").querySelectorAll('.mrows .chip[data-r="1"]')];
  const src=A.filter(x=>x.dataset.h==="1").concat(A.filter(x=>x.dataset.h==="0"),B.filter(x=>x.dataset.h==="0"));
  const stay=B.filter(x=>x.dataset.h==="1");
  const dest=[...$("#uLine").querySelectorAll(".chip")],seps=[...$("#uLine").querySelectorAll(".times")];
  if(live()){
    G.set(seps,{autoAlpha:0});G.to(stay,{opacity:.3,duration:.4,delay:.2});
    dest.forEach((d,k)=>{const s0=src[k];if(!s0)return;const r1=s0.getBoundingClientRect(),r2=d.getBoundingClientRect(),t=.4+k*.35;
      G.fromTo(d,{x:r1.left-r2.left,y:r1.top-r2.top,scale:1.2},{x:0,y:0,scale:1,duration:.7,ease:"power2.inOut",delay:t});
      G.to(s0,{opacity:.3,duration:.3,delay:t});if(seps[k-1])G.to(seps[k-1],{autoAlpha:1,duration:.2,delay:t+.5});});
  }else{stay.forEach(x=>x.style.opacity=.3);src.forEach(x=>x.style.opacity=.3)}
  view($("#ansPad"));
  nam(c.length?"شاهد: العامل المشترك ينزل مرة واحدة، ثم تنزل العوامل الباقية. اضرب ما في السطر.":"لا يوجد عامل مشترك، فتنزل كل العوامل. اضرب ما في السطر.");
  S.hintFn=()=>times(all)+" = ؟";
}
function press(k){
  if(k==="ok")return checkAns();
  if(k==="del")S.ans=S.ans.slice(0,-1);else if(S.ans.length<3)S.ans+=k;
  const box=$("#ansBox");box.textContent=S.ans?ar(S.ans):"؟";box.classList.toggle("empty",!S.ans);
  if(k!=="del")T.fromTo(box,{scale:1.08},{scale:1,duration:.2});
}
function checkAns(){
  const [a,b]=S.pair,{c,ra,rb}=unionOf(a,b),all=c.concat(ra,rb),right=lcm(a,b);
  if(!S.ans){nam("اكتب الإجابة باستخدام لوحة الأرقام، ثم اضغط تحقّق.","tip");shake($("#ansBox"));return}
  if(+S.ans===right){sfx.win();return roundDone()}
  S.ansTries++;shake($("#ansBox"));
  if(S.ansTries>=3){
    nam("الإجابة الصحيحة هي "+ar(right)+"، لأن "+times(all)+" = "+ar(right)+".","bad");
    $("#ansPad").querySelectorAll("button").forEach(x=>x.disabled=true);
    $("#stage").insertAdjacentHTML("beforeend",`<div class="actions"><button type="button" class="btn primary" id="contBtn">متابعة</button></div>`);
    $("#contBtn").addEventListener("click",roundDone);$("#contBtn").focus({preventScroll:true});view($("#contBtn"));return;
  }
  nam(ar(S.ans)+" ليست الإجابة الصحيحة. اضرب: "+times(all)+" = ؟","bad");
  S.ans="";const box=$("#ansBox");box.textContent="؟";box.classList.add("empty");
}

/* ---------- round summary ---------- */
function roundDone(){
  const [a,b]=S.pair,right=lcm(a,b),{c,ra,rb}=unionOf(a,b);
  const earned=S.slips===0?3:S.slips<=2?2:1;
  S.results.push({a,b,gcf:right,stars:earned,slips:S.slips});
  const before=S.stars;S.stars+=earned;
  S.step=STEPS().length;renderStepper();S.hintFn=null;

/* =========================================================
   Simplify a fraction: GCF by inspection + equivalent-fraction bars
   ========================================================= */
const fracHTML=(n,d,cls="")=>`<span class="frac ${cls}"><span>${ar(n)}</span><span>${ar(d)}</span></span>`;
const bar=(n,d,cls="")=>`<div class="fbar ${cls}" role="img" aria-label="${ar(n)} من ${ar(d)}">${Array.from({length:d},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`;
const FOOD=d=>[2,4,8,16].includes(d)?"pizza":[3,6,12].includes(d)?"cake":"choc";
const pieces=n=>n===1?"قطعة واحدة":n===2?"قطعتان":n<=10?ar(n)+" قطع":ar(n)+" قطعة";
function food(n,d,kind,id){
  kind=kind||FOOD(d);
  const name=kind==="pizza"?"بيتزا":kind==="cake"?"كعكة":"لوح شوكولاتة";
  const cap=`${name} مقسّمة إلى ${pieces(d)} متساوية، الملوّن منها ${pieces(n)}`;
  if(kind==="choc"){
    return `<div class="food" ${id?`id="${id}"`:""}><div class="choc" role="img" aria-label="${cap}">${Array.from({length:d},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div><span class="cap">${cap}</span></div>`;
  }
  const R=66,C=75,pt=a=>[C+R*Math.cos(a),C+R*Math.sin(a)],step=2*Math.PI/d,st=-Math.PI/2;
  let sl="",ln="",top="";
  for(let i=0;i<d;i++){
    /* RTL: fill clockwise from the top, like reading direction on a clock */
    const a0=st+i*step,a1=a0+step,[x0,y0]=pt(a0),[x1,y1]=pt(a1),on=i<n,large=step>Math.PI?1:0;
    const fill=on?(kind==="pizza"?"#f6c453":"#f7a1c4"):"#f4efe6";
    sl+=`<path d="M${C},${C} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${fill}"/>`;
    if(on){const am=a0+step/2;
      if(kind==="pizza"){[[.55,0],[.78,-.22],[.78,.22]].forEach(([r,o])=>{if(d>8&&o)return;const x=C+R*r*Math.cos(am+o*step),y=C+R*r*Math.sin(am+o*step);top+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d>8?4:5.5}" fill="#d0402c"/>`})}
      else{const x=C+R*.72*Math.cos(am),y=C+R*.72*Math.sin(am);top+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d>8?3.5:5}" fill="#e2553a"/>`}}
  }
  for(let i=0;i<d;i++){const [x,y]=pt(st+i*step);ln+=`<line class="slice-line" data-i="${i}" x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}
  const rim=kind==="pizza"?`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#d08a3a" stroke-width="7"/>`:`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#c9884f" stroke-width="5"/><circle cx="${C}" cy="${C}" r="${R-7}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>`;
  return `<div class="food" ${id?`id="${id}"`:""}><svg viewBox="0 0 150 150" role="img" aria-label="${cap}"><circle cx="${C}" cy="${C}" r="${R+6}" fill="#fff" stroke="#c5cfe9" stroke-width="2"/>${sl}${top}${ln}${rim}</svg><span class="cap">${cap}</span></div>`;
}
const divisors=n=>{const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r};
const multiples=(d,k)=>Array.from({length:k},(_,i)=>d*(i+1));
function lcdFind(){
  const [n1,d1,n2,d2]=S.pair,L=lcm(d1,d2),kind=FOOD(L);
  const k1=Math.min(10,Math.max(5,L/d1+2)),k2=Math.min(10,Math.max(5,L/d2+2));
  const row=(d,k,r)=>`<div class="mrow"><div class="lbl">${ar(d)}</div><div class="mchips">${multiples(d,k).map(v=>`<button type="button" class="chip" style="--c:${r?"var(--c2)":"var(--c1)"}" data-r="${r}" data-v="${v}">${ar(v)}</button>`).join("")}</div></div>`;
  $("#stage").innerHTML=`
    <div class="ptitle"><span class="sym" style="--c:var(--c2)">×</span><div><h3>ابحث بالنظر</h3><p>لا نستطيع المقارنة والقطع مختلفة الحجم. نحتاج مقامًا مشتركًا.</p></div></div>
    <div class="cmp">
      <div>${fracHTML(n1,d1,"mid")}${food(n1,d1,kind)}</div>
      <div>${fracHTML(n2,d2,"mid")}${food(n2,d2,kind)}</div>
    </div>
    <p class="ask" style="margin-top:14px">هذه مضاعفات المقامين. اضغط على <b>أصغر</b> عدد يظهر في الصفين معًا.</p>
    <div class="mrows">${row(d1,k1,0)}${row(d2,k2,1)}</div>`;
  T.from("#stage .cmp > div, #stage .mrow",{y:12,autoAlpha:0,stagger:.07});
  $("#stage .mrows").addEventListener("click",e=>{
    const c=e.target.closest(".chip");if(!c||c.disabled||S.L)return;
    const v=+c.dataset.v,inA=v%d1===0,inB=v%d2===0;
    if(v===L){
      S.L=L;$("#stage").querySelectorAll(`.mrows .chip[data-v="${L}"]`).forEach(x=>{x.classList.add("hl");pop(x)});
      $("#stage").querySelectorAll(".mrows .chip").forEach(x=>x.disabled=true);
      nam(`${ar(L)} أصغر عدد من مضاعفات ${ar(d1)} و ${ar(d2)} معًا، فهو المقام المشترك الأصغر.`,"ok");T.later(1.4,()=>goStep(1));return;
    }

    else nam(`${ar(v)} من مضاعفات ${ar(inA?d1:d2)}، لكنه ليس من مضاعفات ${ar(inA?d2:d1)}.`,"bad");
  });
  view($("#stage .mrows"));
  S.hintFn=()=>`ابحث عن أول عدد تراه في صف ${ar(d1)} وفي صف ${ar(d2)} معًا.`;
}
const FI={n:"",d:"",act:"n"};
function lcdConvert(){
  const [n1,d1,n2,d2]=S.pair,L=lcm(d1,d2),k1=L/d1,k2=L/d2;
  Object.assign(FI,{n:"",d:"",act:"n"});
  const row=(n,d,k,id)=>`<div class="conv-row">${fracHTML(n,d,"mid")}<span class="mult"><span>× ${ar(k)}</span><span>× ${ar(k)}</span></span><span>=</span><span class="fbox"><span class="pbox" id="${id}" role="button" tabindex="0">؟</span><span class="fline"></span><span class="num" style="font-size:30px">${ar(L)}</span></span></div>`;
  $("#stage").innerHTML=`
    <div class="ptitle"><span class="sym" style="--c:var(--c4)">×</span><div><h3>اجعل المقام ${ar(L)} في الكسرين</h3><p>نضرب البسط والمقام في العدد نفسه، فتبقى قيمة الكسر كما هي.</p></div></div>
    <div class="conv">
      ${row(n1,d1,k1,"fN")}
      ${row(n2,d2,k2,"fD")}
      <div class="pad" dir="ltr" id="fPad" role="group" aria-label="لوحة الأرقام">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" class="key" data-k="${d}">${ar(d)}</button>`).join("")}<button type="button" class="key fn" data-k="del">حذف</button><button type="button" class="key" data-k="0">٠</button><button type="button" class="key go" data-k="ok">تحقّق</button></div>
    </div>`;
  fShow();
  $("#fPad").addEventListener("click",e=>{const k=e.target.closest(".key");if(k)fKey(k.dataset.k)});
  [["#fN","n"],["#fD","d"]].forEach(([q,c])=>$(q).addEventListener("click",()=>{FI.act=c;fShow()}));
  T.from("#stage .conv > *",{y:12,autoAlpha:0,stagger:.07});view($("#fPad"));
  nam(`احسب البسط الجديد لكل كسر: ${ar(n1)} × ${ar(k1)}، و ${ar(n2)} × ${ar(k2)}.`);
  S.hintFn=()=>`${ar(n1)} × ${ar(k1)} = ؟ &nbsp;و&nbsp; ${ar(n2)} × ${ar(k2)} = ؟`;
}
function fShow(){$("#fN").textContent=FI.n?ar(FI.n):"؟";$("#fD").textContent=FI.d?ar(FI.d):"؟";$("#fN").classList.toggle("act",FI.act==="n");$("#fD").classList.toggle("act",FI.act==="d");$("#fN").classList.toggle("filled",!!FI.n);$("#fD").classList.toggle("filled",!!FI.d)}
function fKey(k){
  const [n1,d1,n2,d2]=S.pair,L=lcm(d1,d2),a1=n1*L/d1,a2=n2*L/d2,c=FI.act;
  if(k==="del"){if(!FI[c]&&c==="d")FI.act="n";else FI[c]=FI[c].slice(0,-1);return fShow()}
  if(k==="ok"){
    if(!FI.n||!FI.d){FI.act=FI.n?"d":"n";fShow();nam("اكتب البسط الجديد للكسرين، ثم اضغط تحقّق.","tip");return}
    const ok1=+FI.n===a1,ok2=+FI.d===a2;
    if(ok1&&ok2){$("#fPad").querySelectorAll("button").forEach(x=>x.disabled=true);pop($("#fN"));pop($("#fD"));nam(`${fracHTML(n1,d1)} = ${fracHTML(a1,L)} و ${fracHTML(n2,d2)} = ${fracHTML(a2,L)}`,"ok");T.later(1.2,()=>goStep(2));return}
    const m=[];if(!ok1)m.push(`${ar(n1)} × ${ar(L/d1)} = ${ar(a1)}، وليس ${ar(FI.n)}`);if(!ok2)m.push(`${ar(n2)} × ${ar(L/d2)} = ${ar(a2)}، وليس ${ar(FI.d)}`);
    shake([!ok1?$("#fN"):null,!ok2?$("#fD"):null].filter(Boolean));nam(m.join("<br>"),"bad");
    if(!ok1)FI.n="";if(!ok2)FI.d="";FI.act=!ok1?"n":"d";fShow();return;
  }
  if(FI[c].length>=2)return;
  FI[c]+=k;if(c==="n"&&FI.n.length>=String(a1).length)FI.act="d";fShow();
}
/* cut both shapes into L equal pieces: the old cuts stay thick, the new cuts appear */

  const sv=fa.querySelector("svg");sv.classList.add("merge","split");sv.querySelectorAll(".slice-line").forEach(l=>l.classList.add(+l.dataset.i%k===0?"edge":"in"));
  setTimeout(()=>sv.classList.remove("split"),live()?900:0);
}

  if(!$("#overlay").hidden||e.target.tagName==="INPUT")return;
  const ai=AR.indexOf(e.key);
  const k=/^[0-9]$/.test(e.key)?e.key:ai>=0?String(ai):e.key==="Backspace"?"del":e.key==="Enter"&&!e.target.closest("button")?"ok":null;
  if(k==null)return;
  if(TI.nd&&$("#trIn")&&!$("#trIn").hidden){tiKey(k);e.preventDefault();return}
  if($("#ansPad")&&!$("#ansPad button").disabled){press(k);e.preventDefault();return}
  if($("#fPad")&&!$("#fPad button").disabled){fKey(k);e.preventDefault();return}
  if($("#ldOpts")){const b=$('#ldOpts [data-v="'+k+'"]:not(:disabled)');if(b){b.click();e.preventDefault()}}
});
